[package]
name = "strix"
version = "0.1.2"
edition = "2021"
description = "Strix - AI-Powered Security Testing Framework"
default-run = "strix"

[lib]
name = "strix"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
notify = "7"
futures = "0.3"
dirs = "6"
strum = { version = "0.26", features = ["derive"] }
printpdf = "0.5"
docx-rs = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[[bin]]
name = "strix-hook-pre-tool-use"
path = "src/hooks/bin/pre_tool_use.rs"

[[bin]]
name = "strix-hook-post-tool-use"
path = "src/hooks/bin/post_tool_use.rs"

[[bin]]
name = "strix-hook-subagent-stop"
path = "src/hooks/bin/subagent_stop.rs"

[[bin]]
name = "strix-hook-pre-compact"
path = "src/hooks/bin/pre_compact.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
